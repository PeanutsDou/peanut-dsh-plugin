name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: node scripts/preflight.mjs
      - run: node scripts/validate-registry.mjs
      - run: node scripts/smoke-spawn.mjs

  # Real-pnpm matrix (9/10/11 via npx) pinning the failure signatures behind
  # #20/#21/#22 and the recovery paths the market automates. Network-bound and
  # slower, so it runs as its own lane on Linux only.
  pnpm-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:compat

  # Layer-3 web e2e: real dsh (pinned rc) + packed market + real Chromium.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm install
      - run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
